server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the browser calls /api, nginx forwards to the backend container.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback for client-side routes like /work-orders/:id
  location / {
    try_files $uri /index.html;
  }
}
